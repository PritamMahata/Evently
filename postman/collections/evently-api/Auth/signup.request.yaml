$kind: http-request
name: Sign Up
method: POST
url: '{{base_url}}/api/auth/signup'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Jane Doe",
      "email": "jane@example.com",
      "password": "password123",
      "confirmPassword": "password123",
      "role": "ATTENDEE"
    }
